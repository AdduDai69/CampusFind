<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Campus Find – Page Not Found')}"></head>
<body>

    <!-- Navigation -->
    <div th:replace="~{fragments/layout :: navbar('home')}"></div>

    <main class="container py-5 text-center">
        <div class="row justify-content-center my-5">
            <div class="col-md-8 col-lg-6">
                <div class="cf-card p-5">
                    <div class="mb-3">
                        <i class="bi bi-compass text-primary" style="font-size: 4rem;"></i>
                    </div>
                    <h1 class="display-6 fw-bold text-white mb-2">Item or Page Not Found</h1>
                    <p class="text-secondary mb-4">
                        The campus lost &amp; found record or resource you are looking for does not exist or may have been deleted.
                    </p>
                    <div class="d-flex justify-content-center gap-2">
                        <a th:href="@{/}" class="btn btn-electric-blue">
                            <i class="bi bi-house-door me-1"></i> Return Home
                        </a>
                        <a th:href="@{/browse}" class="btn btn-cf-outline">
                            <i class="bi bi-search me-1"></i> Browse Items
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/layout :: footer}"></div>

    <!-- Scripts -->
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
