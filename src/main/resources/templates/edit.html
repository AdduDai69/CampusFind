<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Campus Find – Edit Item #' + ${item.id})}"></head>
<body>

    <!-- Navigation -->
    <div th:replace="~{fragments/layout :: navbar('browse')}"></div>

    <!-- Alert Messages -->
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-9 col-xl-8">
                <!-- Page Title -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <span class="text-uppercase text-secondary fw-bold small tracking-wider">Modify Record</span>
                        <h1 class="h2 fw-bold text-white mb-0">Edit Report <span class="text-secondary" th:text="'#' + ${item.id}">#1</span></h1>
                    </div>
                    <a th:href="@{'/items/' + ${item.id}}" class="btn btn-cf-outline btn-sm">
                        <i class="bi bi-x-lg me-1"></i> Cancel
                    </a>
                </div>

                <!-- Form Card -->
                <div class="cf-card p-4 p-md-5 mb-4">
                    <form th:action="@{'/items/' + ${item.id} + '/edit'}" th:object="${item}" method="post">
                        
                        <!-- Validation summary error box -->
                        <div th:if="${#fields.hasErrors('*')}" class="alert alert-cf-error mb-4" role="alert">
                            <div class="d-flex align-items-center gap-2 fw-bold mb-1">
                                <i class="bi bi-exclamation-triangle-fill"></i> Please fix the following errors:
                            </div>
                            <ul class="mb-0 ps-3 small">
                                <li th:each="err : ${#fields.errors('*')}" th:text="${err}">Error message</li>
                            </ul>
                        </div>

                        <!-- 1. Report Type & Status -->
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="type" class="form-label">Report Type <span class="text-danger">*</span></label>
                                <select id="type" th:field="*{type}" class="form-select cf-select" required>
                                    <option value="LOST">LOST (Missing Item)</option>
                                    <option value="FOUND">FOUND (Discovered Item)</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="status" class="form-label">Resolution Status <span class="text-danger">*</span></label>
                                <select id="status" th:field="*{status}" class="form-select cf-select" required>
                                    <option value="PENDING">PENDING (Active Search)</option>
                                    <option value="RECOVERED">RECOVERED (Reclaimed)</option>
                                </select>
                            </div>
                        </div>

                        <!-- 2. Item Name & Category -->
                        <div class="row g-3 mb-4">
                            <div class="col-md-7">
                                <label for="name" class="form-label">Item Name / Title <span class="text-danger">*</span></label>
                                <input type="text" id="name" th:field="*{name}" class="form-control cf-input" required>
                                <div th:if="${#fields.hasErrors('name')}" class="text-danger small mt-1" th:errors="*{name}"></div>
                            </div>

                            <div class="col-md-5">
                                <label for="category" class="form-label">Category <span class="text-danger">*</span></label>
                                <select id="category" th:field="*{category}" class="form-select cf-select" required>
                                    <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}">Category</option>
                                </select>
                                <div th:if="${#fields.hasErrors('category')}" class="text-danger small mt-1" th:errors="*{category}"></div>
                            </div>
                        </div>

                        <!-- 3. Location & Date -->
                        <div class="row g-3 mb-4">
                            <div class="col-md-7">
                                <label for="location" class="form-label">Campus Location <span class="text-danger">*</span></label>
                                <input type="text" id="location" th:field="*{location}" class="form-control cf-input" required>
                                <div th:if="${#fields.hasErrors('location')}" class="text-danger small mt-1" th:errors="*{location}"></div>
                            </div>

                            <div class="col-md-5">
                                <label for="dateReported" class="form-label">Date Reported <span class="text-danger">*</span></label>
                                <input type="date" id="dateReported" th:field="*{dateReported}" class="form-control cf-input" required>
                                <div th:if="${#fields.hasErrors('dateReported')}" class="text-danger small mt-1" th:errors="*{dateReported}"></div>
                            </div>
                        </div>

                        <!-- 4. Description -->
                        <div class="mb-4">
                            <label for="description" class="form-label">Detailed Description <span class="text-danger">*</span></label>
                            <textarea id="description" th:field="*{description}" class="form-control cf-textarea" rows="4" required></textarea>
                            <div th:if="${#fields.hasErrors('description')}" class="text-danger small mt-1" th:errors="*{description}"></div>
                        </div>

                        <!-- 5. Contact -->
                        <div class="mb-4">
                            <label for="contact" class="form-label">Contact Information</label>
                            <input type="text" id="contact" th:field="*{contact}" class="form-control cf-input">
                        </div>

                        <!-- Action Buttons -->
                        <div class="d-flex justify-content-between align-items-center gap-3 mt-4 pt-3 border-top" 
                             style="border-color: var(--border-subtle) !important;">
                            <a th:href="@{'/items/' + ${item.id}}" class="btn btn-cf-outline">
                                <i class="bi bi-arrow-left me-1"></i> Cancel
                            </a>
                            <button type="submit" class="btn btn-stark-white px-4 py-2">
                                <i class="bi bi-check-lg me-1"></i> Save Changes
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/layout :: footer}"></div>

    <!-- Scripts -->
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
